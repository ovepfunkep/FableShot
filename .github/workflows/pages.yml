name: Publish FableShot release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft GitHub Release ID with signed Android APK
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      code: ${{ steps.release.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify matching Android release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          tag="v$(node -p "require('./web/package.json').version")"
          code=$(node -p "require('./web/package.json').config.androidVersionCode")
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -e --arg tag "$tag" --arg sha "$GITHUB_SHA" --arg apk "FableShot-android-$code.apk" '
              .draft and (.prerelease | not) and .tag_name == $tag and .target_commitish == $sha
              and any(.assets[]; .name == $apk and .state == "uploaded" and .size > 0)'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install Chromium for release checks
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Check training, archives, offline startup and rooms
        run: npm run test:ui -- training.spec.ts training-analysis.spec.ts progress-timeline.spec.ts numbered-arrows.spec.ts migration-parity.spec.ts archive.spec.ts mytargets-ui.spec.ts onboarding-theme.spec.ts settings-navigation.spec.ts offline-readiness.spec.ts local-room-probe.spec.ts storage-migration.spec.ts
        env:
          FABLE_BROWSER: chromium
        working-directory: web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  publish-android:
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish matching Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TAG: ${{ needs.verify.outputs.tag }}
          CODE: ${{ needs.verify.outputs.code }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" |
            jq -e --arg tag "$TAG" --arg apk "FableShot-android-$CODE.apk" '
              .tag_name == $tag and any(.assets[]; .name == $apk and .state == "uploaded")'
  announce-android:
    needs: [verify, publish-android]
    if: ${{ vars.FABLESHOT_FCM_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Get short-lived FCM credentials
        id: fcm-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.FABLESHOT_FCM_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FABLESHOT_FCM_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          create_credentials_file: false
      - name: Announce the published release to Android subscribers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_CODE: ${{ needs.verify.outputs.code }}
          FCM_PROJECT_ID: ${{ vars.FABLESHOT_FCM_PROJECT_ID }}
          FCM_ACCESS_TOKEN: ${{ steps.fcm-auth.outputs.access_token }}
        run: node web/scripts/send-release-push.mjs
